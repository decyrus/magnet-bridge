name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  format:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check Swift formatting
        run: xcrun swift-format lint --recursive --strict Sources Tests

  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        architecture: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: |
          xcodebuild \
            -project MagnetBridge.xcodeproj \
            -scheme MagnetBridge \
            -configuration "${{ matrix.configuration }}" \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS="${{ matrix.architecture }}" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Test core package
        run: swift test
      - name: Test Xcode project
        run: |
          xcodebuild \
            -project MagnetBridge.xcodeproj \
            -scheme MagnetBridge \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test
