name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}

      - name: Configure notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials ci-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APP_PASSWORD"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq .body \
            > "${RUNNER_TEMP}/release-notes.md"

      - name: Build, sign, notarize, and package
        env:
          VERSION: ${{ github.ref_name }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARY_PROFILE: ci-notary
          OUTPUT_DIRECTORY: ${{ runner.temp }}/release
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is not configured."
            exit 1
          fi
          SPARKLE_KEY_FILE="${RUNNER_TEMP}/magnetbridge-sparkle-key"
          umask 077
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$SPARKLE_KEY_FILE"
          trap 'rm -f "$SPARKLE_KEY_FILE"' EXIT
          export SPARKLE_PRIVATE_KEY_FILE="$SPARKLE_KEY_FILE"
          scripts/release.sh

      - name: Verify release metadata
        run: |
          test -s "${{ runner.temp }}/release/MagnetBridge.zip"
          test -s "${{ runner.temp }}/release/MagnetBridge.zip.sha256"
          test -s "${{ runner.temp }}/release/magnet-bridge.rb"
          test -s "${{ runner.temp }}/release/appcast.xml"
          xmllint --noout "${{ runner.temp }}/release/appcast.xml"
          grep -q 'sparkle:edSignature=' "${{ runner.temp }}/release/appcast.xml"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "${{ runner.temp }}/release/MagnetBridge.zip" \
            "${{ runner.temp }}/release/MagnetBridge.zip.sha256" \
            "${{ runner.temp }}/release/magnet-bridge.rb" \
            "${{ runner.temp }}/release/appcast.xml" \
            --notes-file "${{ runner.temp }}/release-notes.md" \
            --title "MagnetBridge ${{ github.ref_name }}"

      - name: Check out Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v6
        with:
          repository: decyrus/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          cp \
            "${{ runner.temp }}/release/magnet-bridge.rb" \
            homebrew-tap/Casks/magnet-bridge.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/magnet-bridge.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update MagnetBridge to ${{ github.ref_name }}"
          git push

      - name: Report missing Homebrew credential
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: |
          echo "::warning::HOMEBREW_TAP_TOKEN is not set; the tap was not updated."
